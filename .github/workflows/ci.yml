name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result even if one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: scripts
        run: ./install-deps-ubuntu.sh

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        working-directory: scripts
        run: ./install-deps-macos.sh

      # Cheap and platform-independent, so it runs before the build: a
      # formatting slip should fail in seconds, not after a full LLVM link.
      - name: Formatting check
        working-directory: scripts
        run: ./format.sh --check

      - name: Build lcc
        working-directory: scripts
        run: ./build-lcc.sh

      # clang-tidy needs the compile database the build just produced. Run it on
      # one platform only: the findings are host-independent, and a third copy
      # would triple the slowest non-build step for no extra signal.
      - name: clang-tidy check
        if: matrix.os == 'ubuntu-24.04'
        working-directory: scripts
        run: ./tidy.sh

      # Doxygen exits 0 after warning about a broken \param or reference, so
      # docs.sh gates on the warning log instead. One platform, for the same
      # reason as clang-tidy: the findings do not depend on the host.
      - name: Documentation check
        if: matrix.os == 'ubuntu-24.04'
        working-directory: scripts
        run: ./docs.sh

      - name: Compile tests
        working-directory: scripts
        run: ./compile-tests.sh

      - name: Link tests
        working-directory: scripts
        run: |
          source ./build-env.sh
          echo "LCC_LINKER=${LCC_LINKER}"
          ./link-tests.sh

      - name: Run tests
        working-directory: scripts
        run: ./run-tests.sh

      - name: Debug info smoke test
        working-directory: scripts
        run: ./check-debug-info.sh

      - name: Assembly emission smoke test
        working-directory: scripts
        run: ./check-asm-smoke.sh

      - name: Machine pass smoke test
        working-directory: scripts
        run: ./check-machine-pass-smoke.sh

      - name: Benchmark smoke test
        working-directory: scripts
        run: ./bench.sh --smoke

  # lcc compiling the suite while instrumented, which is where a use-after-free
  # on the AST, a stale llvm::Value*, or signed overflow in the constant folder
  # would show up. ASan and UBSan share one job because they compose into a
  # single build, and that build is the slowest thing in this file. One platform
  # is enough: the findings are host-independent.
  asan:
    name: Sanitizers
    runs-on: ubuntu-24.04
    env:
      # LeakSanitizer rides along with ASan on Linux, and is only useful now that
      # the leaks it would have tripped over are gone: the orphaned
      # llvm::BasicBlock in SwitchStmt::genCode is fixed, and main holds an
      # llvm_shutdown_obj so LLVM's own ManagedStatic registries are released at
      # exit. This is the only place any of that is verified — LeakSanitizer does
      # not run on macOS, so a developer build there cannot check it.
      #
      # One known leak remains and is deliberately not covered: the AST nodes a
      # partial AST::Decls holds when a parse fails. No test in the suite fails
      # to parse, so this job never reaches it. Adding such a test means fixing
      # that leak first.
      ASAN_OPTIONS: detect_leaks=1
      # A UBSan report is only actionable with a stack trace, and the runtime
      # needs to be told to collect one; the build already passes
      # -fno-sanitize-recover, so the process aborts on the first finding.
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: scripts
        run: ./install-deps-ubuntu.sh

      - name: Build lcc with ASan and UBSan
        working-directory: scripts
        run: ./build-lcc.sh --asan --ubsan

      # Both modes: -O0 and -O2 take different paths through the middle end, and
      # only the instrumented lcc process matters here — the programs it emits
      # are not themselves built with the sanitizers.
      - name: Compile tests under sanitizers
        working-directory: scripts
        run: |
          ./compile-tests.sh
          ./compile-tests.sh --release
