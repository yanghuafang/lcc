name: CI

on:
  push:
    branches: [lcc-llvm-14]
  pull_request:
    branches: [lcc-llvm-14]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result even if one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: scripts
        run: ./install-deps-ubuntu.sh

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        working-directory: scripts
        run: ./install-deps-macos.sh

      - name: Build lcc
        working-directory: scripts
        run: ./build-lcc.sh

      - name: Compile tests
        working-directory: scripts
        run: ./compile-tests.sh

      - name: Link tests
        working-directory: scripts
        run: |
          source ./build-env.sh
          echo "LCC_LINKER=${LCC_LINKER}"
          ./link-tests.sh

      - name: Run tests
        working-directory: scripts
        run: ./run-tests.sh

      - name: Debug info smoke test
        working-directory: scripts
        run: ./check-debug-info.sh
