name: Sanitizer

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # lcc compiling the suite while instrumented, which is where a use-after-free
  # on the AST, a stale llvm::Value*, or signed overflow in the constant folder
  # would show up. Its own workflow because instrumentation makes the build slow
  # enough that nothing else should have to wait behind it. ASan and UBSan share
  # one job because they compose into a single build. Both
  # platforms: the two hosts differ in allocator and in architecture, so a
  # lifetime bug can be reported on one and missed on the other.
  sanitize:
    name: ${{ matrix.name }} / ASan + UBSan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
            # LeakSanitizer rides along with ASan on Linux, and is only useful
            # now that the leaks it would have tripped over are gone: the
            # orphaned llvm::BasicBlock in SwitchStmt::genCode is fixed, and
            # main holds an llvm_shutdown_obj so LLVM's own ManagedStatic
            # registries are released at exit. This leg is the only place any
            # of that is verified — LeakSanitizer does not run on macOS, so
            # neither the macOS leg nor a developer build there can check it.
            #
            # One known leak remains and is deliberately not covered: the AST
            # nodes a partial AST::Decls holds when a parse fails. No test in
            # the suite fails to parse, so this job never reaches it. Adding
            # such a test means fixing that leak first.
            asan_options: detect_leaks=1
          - name: macOS
            os: macos-latest
            # Not merely unused on macOS: ASan there rejects detect_leaks=1
            # outright, so the option has to be spelled off rather than omitted
            # from the matrix.
            asan_options: detect_leaks=0
    env:
      ASAN_OPTIONS: ${{ matrix.asan_options }}
      # A UBSan report is only actionable with a stack trace, and the runtime
      # needs to be told to collect one; the build already passes
      # -fno-sanitize-recover, so the process aborts on the first finding.
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: scripts
        run: ./install-deps-ubuntu.sh

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        working-directory: scripts
        run: ./install-deps-macos.sh

      - name: Build lcc with ASan and UBSan
        working-directory: scripts
        run: ./build-lcc.sh --asan --ubsan

      # Both modes: -O0 and -O2 take different paths through the middle end, and
      # only the instrumented lcc process matters here — the programs it emits
      # are not themselves built with the sanitizers.
      - name: Compile tests under sanitizers
        working-directory: scripts
        run: |
          ./compile-tests.sh
          ./compile-tests.sh --release
